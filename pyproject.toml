[project]
name = "summarease-django"
version = "1.0.0"
description = "Web application for smart content summarization using TextRank and Gemini AI"
requires-python = ">=3.10"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py"]
testpaths = ["."]
pythonpath = ["backend"]

[tool.coverage.run]
source = ["."]
omit = ["*/migrations/*", "*/tests/*"]
