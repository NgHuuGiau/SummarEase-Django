# Legacy development compose file. Use ../docker-compose.yml for the supported
# production-style stack; this file is retained only for older local setups.
services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile-python
    container_name: summarease-django-backend
    ports:
      - "8000:8000"
    env_file:
      - ../backend/.env
    volumes:
      - ..:/app
    command: >
      sh -c "python manage.py migrate &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    depends_on:
      db:
        condition: service_healthy

  db:
    build:
      context: .
      dockerfile: Dockerfile-mysql
    container_name: summarease-django-db
    restart: always
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: summarease_django
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  db_data:
