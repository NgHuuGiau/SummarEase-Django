services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile-python
    container_name: summarease-django-backend
    ports:
      - "8000:8000"
    env_file:
      - ../backend/.env
    volumes:
      - ..:/app
    depends_on:
      - db

  db:
    build:
      context: .
      dockerfile: Dockerfile-mysql
    container_name: summarease-django-db
    restart: always
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: summarease_django
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - ../backend/sql/schema_sqlserver.sql:/docker-entrypoint-initdb.d/1_schema.sql
      - db_data:/var/lib/mysql

volumes:
  db_data:
