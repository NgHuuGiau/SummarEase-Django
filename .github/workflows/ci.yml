name: CI Pipeline

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - '.gitignore'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '*.md'
      - '.gitignore'
      - 'docs/**'
  schedule:
    - cron: "0 3 * * 1"  # Weekly Monday 3AM

permissions:
  contents: read
  security-events: write
  pull-requests: write

env:
  PYTHON_VERSION: '3.12'
  DJANGO_SETTINGS_MODULE: 'config.settings'
  DJANGO_ALLOWED_HOSTS: 'localhost,127.0.0.1,testserver'
  SECRET_KEY: 'ci-insecure-key-for-tests-only'
  DB_ENGINE: 'sqlite'

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Ruff
        run: pip install "ruff>=0.6"

      - name: Run Ruff check
        run: ruff check backend manage.py
        continue-on-error: false

      - name: Run Ruff format check
        run: ruff format --check backend manage.py
        continue-on-error: false

  security:
    name: Security Scan (Dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security tools
        run: |
          pip install pip-audit==2.7.0 safety==3.2.1

      - name: Run pip-audit (dependencies vulnerabilities)
        run: |
          pip-audit -r requirements.txt -f json -o pip-audit-results.json || true

      - name: Run Safety
        run: |
          safety check -r requirements.txt --json -o safety-results.json || true

      - name: Upload security artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-results
          path: |
            pip-audit-results.json
            safety-results.json
          retention-days: 14

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Django system check
        run: python manage.py check --traceback

      - name: Migration check (no pending)
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests with coverage
        env:
          DJANGO_ALLOWED_HOSTS: '*'
        run: |
          python -m pytest backend -q \
            --cov-config=pyproject.toml --cov=backend \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=90 \
            --tb=short \
            --junitxml=test-results-${{ matrix.python-version }}.xml

      - name: Upload coverage/test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.python-version }}
          path: |
            coverage.xml
            test-results-*.xml
          retention-days: 7

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: ${{ matrix.python-version == '3.12' }}
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-${{ matrix.python-version }}

  build:
    name: Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Django deploy check
        env:
          DJANGO_ALLOWED_HOSTS: '*'
        run: python manage.py check --deploy --fail-level=ERROR

      - name: Collect static (dry-run)
        env:
          DJANGO_ALLOWED_HOSTS: '*'
        run: python manage.py collectstatic --dry-run --noinput --clear

      - name: Smoke test — backup_db command
        run: python manage.py backup_db --dest /tmp/test_backup

      - name: Smoke test — health endpoint
        run: |
          python -c "
import django, os
os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'config.settings')
django.setup()
from django.test import Client
c = Client()
resp = c.get('/health/')
assert resp.status_code == 200, f'Health failed: {resp.status_code}'
assert resp.json()['status'] in ('healthy', 'degraded')
print('Health OK:', resp.json())
"

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    if: always()
    needs: [lint, security, test, build]
    steps:
      - name: Collect results
        run: |
          echo "## CI Pipeline Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Lint | ${{ needs.lint.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Security | ${{ needs.security.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tests | ${{ needs.test.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build | ${{ needs.build.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**All checks must pass for merge.**" >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if any job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::One or more CI jobs failed"
          exit 1
