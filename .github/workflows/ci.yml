name: CI Pipeline

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - '.gitignore'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '*.md'
      - '.gitignore'
      - 'docs/**'

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'
  DJANGO_SETTINGS_MODULE: 'config.settings'
  DJANGO_ALLOWED_HOSTS: 'localhost,127.0.0.1,testserver'
  SECRET_KEY: 'ci-insecure-key-for-tests-only'
  DB_ENGINE: 'sqlite'
  DJANGO_TEST: '1'

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Ruff
        run: pip install "ruff>=0.6"

      - name: Run Ruff check
        run: ruff check backend manage.py

      - name: Run Ruff format check
        run: ruff format --check backend manage.py

  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pip install mypy

      - name: Run mypy
        run: >-
          mypy backend manage.py --ignore-missing-imports --no-error-summary
          --follow-imports=skip
          --disable-error-code attr-defined
          --disable-error-code var-annotated
          --disable-error-code misc
          --disable-error-code truthy-function
          --disable-error-code assignment
          --disable-error-code union-attr

  security:
    name: Security Scan (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -r requirements.txt pip-audit

      - name: Run pip-audit (fail on vulnerabilities)
        run: |
          set +e
          pip-audit -r requirements.txt -f json -o pip-audit-results.json
          audit_status=$?
          if [ "$audit_status" -ne 0 ]; then
            echo "Audit details:"
            pip-audit -r requirements.txt -f columns
          fi
          exit "$audit_status"

      - name: Upload security artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-results
          path: |
            pip-audit-results.json
          retention-days: 14

  test:
    name: Django Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Django system check
        run: python manage.py check --traceback

      - name: Migration check (no pending)
        run: python manage.py makemigrations --check --dry-run

      - name: Run backend tests
        env:
          PYTHONPATH: backend
          DJANGO_ALLOWED_HOSTS: '*'
        run: |
          python -m pytest backend/summaries/tests.py -q \
            --cov-config=pyproject.toml --cov=backend \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            --tb=short \
            --junitxml=test-results.xml

      - name: Upload coverage/test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            coverage.xml
            test-results.xml
          retention-days: 7

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: unittests

  mysql_integration:
    name: MySQL Integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-mysql-password
          MYSQL_DATABASE: summarease
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=ci-mysql-password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_ENGINE: mysql
      DB_NAME: summarease
      DB_USER: root
      DB_PASSWORD: ci-mysql-password
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Check migrations and webhook integration on MySQL
        env:
          PYTHONPATH: backend
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python -m pytest backend/summaries/tests.py -q -k WebhookSecurityTests --tb=short

  sqlserver_integration:
    name: SQL Server Integration
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: "Ci_only_Passw0rd!2026"
        ports:
          - 1433:1433
    env:
      DB_ENGINE: sqlserver
      DB_NAME: SummarEase_CI
      DB_USER: sa
      DB_PASSWORD: "Ci_only_Passw0rd!2026"
      DB_HOST: 127.0.0.1
      DB_PORT: '1433'
      DB_DRIVER: ODBC Driver 18 for SQL Server
      DB_TRUST_SERVER_CERTIFICATE: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Microsoft ODBC Driver 18
        run: |
          curl -fsSLo /tmp/packages-microsoft-prod.deb https://packages.microsoft.com/config/ubuntu/22.04/packages-microsoft-prod.deb
          sudo dpkg -i /tmp/packages-microsoft-prod.deb
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Wait for SQL Server and create test database
        run: |
          python - <<'PY'
          import time
          import pyodbc

          connection_string = (
              "DRIVER={ODBC Driver 18 for SQL Server};"
              "SERVER=127.0.0.1,1433;UID=sa;PWD=Ci_only_Passw0rd!2026;"
              "Encrypt=yes;TrustServerCertificate=yes;Connection Timeout=5"
          )
          for attempt in range(90):
              try:
                  connection = pyodbc.connect(connection_string, autocommit=True)
                  break
              except pyodbc.Error:
                  if attempt == 89:
                      raise
                  time.sleep(2)
          cursor = connection.cursor()
          cursor.execute("IF DB_ID(N'SummarEase_CI') IS NULL CREATE DATABASE [SummarEase_CI]")
          connection.close()
          PY

      - name: Check migrations and webhook integration on SQL Server
        env:
          PYTHONPATH: backend
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python -m pytest backend/summaries/tests.py -q -k WebhookSecurityTests --tb=short

  frontend_lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check JavaScript syntax
        shell: bash
        run: |
          for file in frontend/static/js/*.js frontend/static/sw.js; do
            node --check "$file"
          done

      - name: Validate frontend manifest
        run: python -m json.tool frontend/static/manifest.json > /dev/null

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SQLITE_DB_PATH: /tmp/summarease-e2e.sqlite3
      MEDIA_ROOT: /tmp/summarease-e2e-media
      BASE_URL: http://127.0.0.1:8000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core
          pip install -r requirements.txt -r requirements-dev.txt
          pip install pytest-playwright
          playwright install --with-deps chromium

      - name: Start Django server
        run: |
          python manage.py migrate --noinput
          python manage.py runserver 127.0.0.1:8000 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health/ > /dev/null; then
              echo "Server is up"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "::error::Django server did not become ready in time"
              exit 1
            fi
            sleep 2
          done

      - name: Run E2E tests
        run: python -m pytest frontend/e2e/test_home.py -v --tb=short

  build:
    name: Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, typecheck, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Django deploy check
        env:
          DJANGO_DEBUG: 'False'
          DJANGO_SECRET_KEY: 'ci-only-production-check-secret-key-not-used-outside-actions'
          API_ENCRYPTION_KEY: 'ci-only-encryption-key'
          DJANGO_ALLOWED_HOSTS: 'app.example.com'
          DB_ENGINE: 'sqlite'
        run: python manage.py check --deploy --fail-level=ERROR

      - name: Validate production Compose configuration
        run: |
          cp backend/.env.example backend/.env
          DJANGO_ALLOWED_HOSTS=app.example.com DB_ENGINE=mysql REDIS_PASSWORD=ci-only-redis-placeholder docker compose --env-file backend/.env config --quiet
          rm backend/.env

      - name: Build Docker image
        run: docker build --tag summarease:ci .

      - name: Collect static (dry-run)
        env:
          DJANGO_ALLOWED_HOSTS: '*'
        run: python manage.py collectstatic --dry-run --noinput --clear

      - name: Prepare database for smoke tests
        run: python manage.py migrate --noinput

      - name: Smoke test — backup_db command
        run: python manage.py backup_db --dest /tmp/test_backup

      - name: Smoke test — verify backup integrity
        run: |
          backup_path="$(find /tmp/test_backup -mindepth 1 -maxdepth 1 -type d -print -quit)"
          python manage.py verify_backup "$backup_path"

      - name: Smoke test — health endpoint
        run: |
          python -c "
          import django, os, sys
          sys.path.insert(0, 'backend')
          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'config.settings')
          django.setup()
          from django.test import Client
          c = Client()
          resp = c.get('/health/')
          assert resp.status_code == 200, f'Health failed: {resp.status_code}'
          assert resp.json()['status'] in ('ok', 'healthy', 'degraded')
          print('Health OK:', resp.json())
          "

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    if: always()
    needs: [lint, typecheck, security, test, mysql_integration, sqlserver_integration, e2e, frontend_lint, build]
    steps:
      - name: Collect results
        run: |
          echo "## CI Pipeline Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Lint (Ruff) | ${{ needs.lint.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Type Check (mypy) | ${{ needs.typecheck.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Security Scan | ${{ needs.security.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Django Tests | ${{ needs.test.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| MySQL Integration | ${{ needs.mysql_integration.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SQL Server Integration | ${{ needs.sqlserver_integration.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| E2E Tests | ${{ needs.e2e.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Frontend Lint | ${{ needs.frontend_lint.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build Verification | ${{ needs.build.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**All checks must pass for merge.**" >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if any job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::One or more CI jobs failed"
          exit 1
