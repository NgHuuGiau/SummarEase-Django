name: CI Pipeline

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - '.gitignore'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '*.md'
      - '.gitignore'
      - 'docs/**'

permissions:
  contents: read
  security-events: write
  pull-requests: write

env:
  PYTHON_VERSION: '3.12'
  DJANGO_SETTINGS_MODULE: 'config.settings'
  DJANGO_ALLOWED_HOSTS: 'localhost,127.0.0.1,testserver'
  SECRET_KEY: 'ci-insecure-key-for-tests-only'
  DB_ENGINE: 'sqlite'
  DJANGO_TEST: '1'

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Ruff
        run: pip install "ruff>=0.6"

      - name: Run Ruff check
        run: ruff check backend manage.py

      - name: Run Ruff format check
        run: ruff format --check backend manage.py

  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pip install mypy

      - name: Run mypy
        run: mypy . --ignore-missing-imports --no-error-summary

  security:
    name: Security Scan (pip-audit + safety)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -r requirements.txt pip-audit safety

      - name: Run pip-audit (fail on vulnerabilities)
        run: pip-audit -r requirements.txt -f json -o pip-audit-results.json

      - name: Run Safety (fail on vulnerabilities)
        run: safety check -r requirements.txt --json -o safety-results.json

      - name: Upload security artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-results
          path: |
            pip-audit-results.json
            safety-results.json
          retention-days: 14

  test:
    name: Django Tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Django system check
        run: python manage.py check --traceback

      - name: Migration check (no pending)
        run: python manage.py makemigrations --check --dry-run

      - name: Run backend tests
        env:
          PYTHONPATH: backend
          DJANGO_ALLOWED_HOSTS: '*'
        run: |
          python -m pytest backend/summaries/tests.py -q \
            --cov-config=pyproject.toml --cov=backend \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=80 \
            --tb=short \
            --junitxml=test-results.xml

      - name: Upload coverage/test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            coverage.xml
            test-results.xml
          retention-days: 7

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: unittests

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pip install pytest-playwright
          playwright install chromium

      - name: Start Django server
        run: |
          python manage.py migrate --noinput
          python manage.py runserver 127.0.0.1:8000 &
          sleep 5

      - name: Run E2E tests
        run: python -m pytest frontend/e2e/test_home.py -v --tb=short

  build:
    name: Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, typecheck, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Django deploy check
        env:
          DJANGO_ALLOWED_HOSTS: '*'
        run: python manage.py check --deploy --fail-level=ERROR

      - name: Collect static (dry-run)
        env:
          DJANGO_ALLOWED_HOSTS: '*'
        run: python manage.py collectstatic --dry-run --noinput --clear

      - name: Smoke test — backup_db command
        run: python manage.py backup_db --dest /tmp/test_backup

      - name: Smoke test — health endpoint
        run: |
          python -c "
import django, os
os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'config.settings')
django.setup()
from django.test import Client
c = Client()
resp = c.get('/health/')
assert resp.status_code == 200, f'Health failed: {resp.status_code}'
assert resp.json()['status'] in ('ok', 'healthy', 'degraded')
print('Health OK:', resp.json())
"

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    if: always()
    needs: [lint, typecheck, security, test, e2e, build]
    steps:
      - name: Collect results
        run: |
          echo "## CI Pipeline Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Lint (Ruff) | ${{ needs.lint.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Type Check (mypy) | ${{ needs.typecheck.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Security Scan | ${{ needs.security.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Django Tests | ${{ needs.test.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| E2E Tests | ${{ needs.e2e.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build Verification | ${{ needs.build.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**All checks must pass for merge.**" >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if any job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::One or more CI jobs failed"
          exit 1